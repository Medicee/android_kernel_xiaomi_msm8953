name: Build Kernel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  DEVICE: tissot
  KERNEL_DEFCONFIG: tissot_defconfig
  OUT_DIR: out
  CLANG_VERSION: r416183b

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v3

    - name: Setup build environment
      run: |
        echo "Installing dependencies..."
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          libssl-dev \
          bison \
          flex \
          bc \
          libelf-dev \
          lz4 \
          curl \
          git \
          wget \
          rsync \
          device-tree-compiler \
          ccache

    - name: Cache CCL toolchain
      uses: actions/cache@v3
      with:
        path: ~/toolchain
        key: ${{ runner.os }}-clang-${{ env.CLANG_VERSION }}
        restore-keys: |
          ${{ runner.os }}-clang-

    - name: Setup CLANG toolchain
      run: |
        mkdir -p ~/toolchain
        cd ~/toolchain
        if [ ! -f "clang_r$CLANG_VERSION/bin/clang" ]; then
          echo "Downloading CLANG toolchain..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11-security-release.tar.gz -O clang.tar.gz 2>/dev/null || {
            echo "Downloading from mirror..."
            wget -q https://clang.llvm.org/builds/clang-r$CLANG_VERSION-linux-x86_64.tar.xz -O clang.tar.xz
            tar -xf clang.tar.xz
            mv clang* clang_r$CLANG_VERSION
          }
        fi
        
    - name: Setup GCC toolchain (fallback)
      run: |
        mkdir -p ~/gcc-toolchain
        cd ~/gcc-toolchain
        if [ ! -d "aarch64-linux-gnu" ]; then
          echo "Downloading GCC ARM64 toolchain..."
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/gcc-arm-10.2-2020.11-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz 2>/dev/null || {
            echo "Using system GCC..."
            sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          }
        fi

    - name: Cache ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Setup kernel build config
      run: |
        mkdir -p ${{ env.OUT_DIR }}
        cp arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }} ${{ env.OUT_DIR }}/.config || {
          # Fallback: use uploaded defconfig
          [ -f "${{ env.KERNEL_DEFCONFIG }}" ] && cp ${{ env.KERNEL_DEFCONFIG }} ${{ env.OUT_DIR }}/.config || {
            echo "Error: defconfig not found"
            exit 1
          }
        }
        echo "Kernel config prepared"

    - name: Prepare build
      run: |
        make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} olddefconfig

    - name: Build kernel with CLANG
      continue-on-error: true
      run: |
        export PATH=~/toolchain/clang_r${{ env.CLANG_VERSION }}/bin:$PATH
        export CC=clang
        export LD=ld.lld
        
        if command -v clang &> /dev/null; then
          echo "Using CLANG: $(clang --version)"
          make -j$(nproc) O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build_clang.log
        else
          echo "CLANG not found, falling back to GCC"
          exit 1
        fi

    - name: Build kernel with GCC (fallback)
      if: failure()
      run: |
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PATH=$PATH:/usr/bin
        
        echo "Using GCC toolchain..."
        make -j$(nproc) O=${{ env.OUT_DIR }} \
          ARCH=${{ env.ARCH }} \
          CROSS_COMPILE=$CROSS_COMPILE \
          2>&1 | tee build_gcc.log

    - name: Build modules
      continue-on-error: true
      run: |
        make -j$(nproc) O=${{ env.OUT_DIR }} \
          ARCH=${{ env.ARCH }} \
          INSTALL_MOD_PATH=${{ env.OUT_DIR }}/modules \
          modules_install

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        
        # Copy kernel image
        if [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image" ]; then
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image artifacts/Image
        elif [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz artifacts/Image.gz
        fi
        
        # Copy device tree blob
        if [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/dts/qcom/msm8953-mtp.dtb" ]; then
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/dts/qcom/msm8953-mtp.dtb artifacts/
        fi
        
        # Copy compiled config
        cp ${{ env.OUT_DIR }}/.config artifacts/
        
        # Copy modules if built
        if [ -d "${{ env.OUT_DIR }}/modules" ]; then
          tar -czf artifacts/modules.tar.gz -C ${{ env.OUT_DIR }} modules/
        fi
        
        # Copy vmlinux for debugging
        if [ -f "${{ env.OUT_DIR }}/vmlinux" ]; then
          cp ${{ env.OUT_DIR }}/vmlinux artifacts/
        fi
        
        ls -lah artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: kernel-build-${{ env.DEVICE }}-${{ github.run_number }}
        path: artifacts/
        retention-days: 30

    - name: Generate build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Device: ${{ env.DEVICE }}" >> $GITHUB_STEP_SUMMARY
        echo "- Architecture: ${{ env.ARCH }}" >> $GITHUB_STEP_SUMMARY
        echo "- Kernel: Linux 4.9.227" >> $GITHUB_STEP_SUMMARY
        echo "- Defconfig: ${{ env.KERNEL_DEFCONFIG }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Status: $([ -f artifacts/Image ] && echo '✅ Success' || echo '⚠️ Check logs')" >> $GITHUB_STEP_SUMMARY
        
        if [ -f build_gcc.log ]; then
          echo -e "\n### GCC Build Log (last 50 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 build_gcc.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
